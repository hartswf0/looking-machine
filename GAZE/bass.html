    const grid = document.getElementById("grid");
    const stats = document.getElementById("stats");
    const search = document.getElementById("search");
    const decade = document.getElementById("decade");
    const bassText = document.getElementById("bass-text");
    const copyBass = document.getElementById("copy-bass");
    let bassRaw = "";

    render();
    void loadBass();

    search.addEventListener("input", render);
    decade.addEventListener("change", render);
    copyBass.addEventListener("click", () => {
      void copyBassMarkdown();
    });

    function render() {
      const query = search.value.trim().toLowerCase();
      const decadeValue = decade.value;
      const filtered = films.filter((film) => {
        const haystack = [
          film.title,
          film.director,
          film.category,
          film.motif,
          String(film.year)
        ].join(" ").toLowerCase();

        if (query && !haystack.includes(query)) {
          return false;
        }

        if (decadeValue === "all") {
          return true;
        }

        const floor = Number(decadeValue);
        return film.year >= floor && film.year < floor + 10;
      });

      stats.textContent = `${filtered.length} films in view (${films.length} total)`;
      grid.innerHTML = "";

      if (!filtered.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No films matched this filter.";
        grid.append(empty);
        return;
      }

      for (const film of filtered) {
        grid.append(createCard(film));
      }
    }

    function createCard(film) {
      const card = document.createElement("article");
      card.className = "card";

      const title = document.createElement("h2");
      title.textContent = `${film.title} (${film.year})`;

      const meta = document.createElement("p");
      meta.className = "meta";
      meta.textContent = `${film.release} | Dir. ${film.director}`;

      const facts = document.createElement("div");
      facts.className = "facts";
      facts.append(
        makeFact("Runtime", film.runtime),
        makeFact("Category", film.category),
        makeFact("Primary motif", film.motif)
      );

      const actions = document.createElement("div");
      actions.className = "actions";
      actions.append(
        makeButton(
          film.youtube || youtubeSearchUrl(film),
          film.youtube ? "YouTube Video" : "YouTube Search",
          true
        ),
        makeButton(studyFallback(film), "Primary Study Link", false)
      );

      const links = document.createElement("div");
      links.className = "links";
      for (const [label, url] of film.study) {
        links.append(makeButton(url, label, false, true));
      }

      card.append(title, meta, facts, actions, links);
      return card;
    }

    function makeFact(label, value) {
      const p = document.createElement("p");
      p.className = "fact";
      const strong = document.createElement("strong");
      strong.textContent = `${label}: `;
      p.append(strong, document.createTextNode(value));
      return p;
    }

    function makeButton(url, label, primary, compact = false) {
      const a = document.createElement("a");
      a.href = url;
      a.target = url.startsWith("http") ? "_blank" : "_self";
      a.rel = "noopener noreferrer";
      a.textContent = label;
      a.className = compact ? "" : `btn ${primary ? "btn-primary" : "btn-soft"}`;
      return a;
    }

    function studyFallback(film) {
      const first = film.study[0];
      return first ? first[1] : "https://www.artofthetitle.com/designer/saul-bass/titles/";
    }

    function youtubeSearchUrl(film) {
      const query = encodeURIComponent(`${film.title} ${film.year} Saul Bass title sequence`);
      return `https://www.youtube.com/results?search_query=${query}`;
    }

    async function loadBass() {
      try {
        const response = await fetch("bass.md", { cache: "no-store" });
        if (!response.ok) {
          throw new Error(`Could not load bass.md (${response.status})`);
        }
        bassRaw = await response.text();
        bassText.textContent = bassRaw;
      } catch (error) {
        bassRaw = "";
        bassText.textContent = String(error.message || error);
      }
    }

    async function copyBassMarkdown() {
      const defaultLabel = copyBass.textContent;
      if (!bassRaw) {
        copyBass.textContent = "No Content";
        window.setTimeout(() => {
          copyBass.textContent = defaultLabel;
        }, 1200);
        return;
      }

      try {
        await navigator.clipboard.writeText(bassRaw);
        copyBass.textContent = "Copied";
        copyBass.classList.add("ok");
      } catch {
        copyBass.textContent = "Copy Failed";
      } finally {
        window.setTimeout(() => {
          copyBass.textContent = defaultLabel;
          copyBass.classList.remove("ok");
        }, 1300);
      }
    }
