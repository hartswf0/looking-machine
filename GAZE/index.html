<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GAZE Video Embeds</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="hero-inner">
      <p class="kicker">GAZE</p>
      <h1>Mobile Embed Library</h1>
      <p id="meta" class="meta">Loading titles from <code>titles.md</code>...</p>
      <nav class="quick-links" aria-label="Site links">
        <a href="index.html">Home</a>
        <a href="minimal-embeds.html">Minimal Embeds</a>
        <a href="film-view.html">Film Viewer</a>
        <a href="prompt.md" target="_blank" rel="noopener noreferrer">prompt.md</a>
        <a href="titles.md" target="_blank" rel="noopener noreferrer">titles.md</a>
        <a href="bass.md" target="_blank" rel="noopener noreferrer">bass.md</a>
      </nav>
    </div>
  </header>

  <main class="main">
    <section id="cards" class="cards" aria-live="polite"></section>
    <section class="docs" id="docs">
      <h2 class="docs-title">Markdown Inspector</h2>
      <p class="docs-meta">Open and copy your markdown files from one place.</p>
      <div id="docs-list" class="docs-list" aria-live="polite"></div>
    </section>
  </main>

  <template id="video-card-template">
    <article class="card">
      <header class="card-header">
        <h2 class="card-title"></h2>
        <p class="card-status"></p>
      </header>

      <div class="player-wrap hidden">
        <iframe
          loading="lazy"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin"
          allowfullscreen
        ></iframe>
      </div>

      <div class="card-actions hidden">
        <a class="btn btn-link open-link" target="_blank" rel="noopener noreferrer">Open on YouTube</a>
        <button class="btn copy-btn" type="button">Copy Embed HTML</button>
      </div>

      <pre class="embed-snippet hidden"><code></code></pre>
    </article>
  </template>

  <script type="module" src="app.js"></script>
</body>
</html>
