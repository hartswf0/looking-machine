<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Creatureliness Manual Flow</title>
  <style>
    :root {
      --bg: #eeebe4;
      --panel: #f8f5ef;
      --ink: #14171e;
      --muted: #5f6570;
      --line: #b8b1a4;
      --primary: #0f1522;
      --radius: 12px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: "Avenir Next", "Segoe UI", system-ui, sans-serif;
    }

    .shell {
      max-width: 1280px;
      margin: 0 auto;
      padding: 10px;
      display: grid;
      gap: 8px;
    }

    .pane {
      border: 2px solid var(--line);
      border-radius: var(--radius);
      background: var(--panel);
      overflow: hidden;
    }

    .head {
      padding: 8px;
      border-bottom: 2px solid var(--line);
      background: #fff;
      display: grid;
      gap: 6px;
    }

    h1 { margin: 0; font-size: 1rem; }

    .meta {
      font-size: 0.74rem;
      color: var(--muted);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .btn {
      min-height: 30px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 10px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font: 800 0.62rem/1.1 inherit;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .toolbar {
      padding: 8px;
      display: grid;
      gap: 8px;
    }

    .search {
      min-height: 34px;
      border: 2px solid var(--line);
      border-radius: 10px;
      background: #fff;
      color: var(--ink);
      font: inherit;
      font-size: 0.78rem;
      padding: 0 10px;
    }

    .count {
      font-size: 0.72rem;
      color: var(--muted);
    }

    .rows {
      max-height: calc(100vh - 190px);
      overflow: auto;
      background: #fff;
    }

    .row {
      border-top: 1px solid #e8e2d6;
      padding: 8px;
      display: grid;
      gap: 6px;
    }

    .row:first-child { border-top: 0; }

    .rid {
      font: 900 0.72rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    }

    .rtitle {
      margin: 0;
      font-size: 0.8rem;
    }

    .cells {
      display: grid;
      gap: 6px;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    }

    .cell {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 7px;
      background: #f9f7f2;
      display: grid;
      gap: 4px;
    }

    .aid {
      font: 800 0.66rem/1 ui-monospace, SFMono-Regular, Menlo, monospace;
      color: var(--muted);
    }

    .alabel {
      margin: 0;
      font-size: 0.75rem;
    }

    .mini-actions {
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
    }

    .mini {
      min-height: 26px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 0 9px;
      background: #fff;
      color: var(--ink);
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font: 800 0.56rem/1.1 inherit;
      letter-spacing: 0.05em;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>

      </div>
      <div id="rows" class="rows"></div>
    </section>

    const el = {
      search: document.getElementById("search"),
      count: document.getElementById("count"),
      rows: document.getElementById("rows"),
      copyAll: document.getElementById("copyAll")
    };

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        return navigator.clipboard.writeText(text);
      }
      const ta = document.createElement("textarea");
      ta.value = text;
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      document.execCommand("copy");
      ta.remove();
      return Promise.resolve();
    }

    function filterMatrix(query) {
      const q = String(query || "").trim().toLowerCase();
      if (!q) return MATRIX;
      return MATRIX.filter(function (item) {
        const hay = [
          item.section.marker,
          item.section.major,
          item.agent.id,
          item.agent.label,
          item.video_prompt
        ].join(" ").toLowerCase();
        return hay.includes(q);
      });
    }

    function render(query) {
      const filtered = filterMatrix(query);
      const grouped = new Map();

      filtered.forEach(function (item) {
        const key = item.section.marker;
        if (!grouped.has(key)) grouped.set(key, []);
        grouped.get(key).push(item);
      });

      const sectionOrder = [...new Set(MATRIX.map((item) => item.section.marker))];
      const rows = [];

      sectionOrder.forEach(function (marker) {
        const items = grouped.get(marker);
        if (!items || !items.length) return;

        items.sort(function (a, b) {
          return a.agent.order - b.agent.order;
        });

        const title = items[0].section.major;

        const cells = items.map(function (item) {
          return [
            '<section class="cell">',
            '<div class="aid">' + item.agent.id + '</div>',
            '<p class="alabel">' + item.agent.label + '</p>',
            '<div class="mini-actions">',
            '<a class="mini" href="' + item.files.page + '">Open Page</a>',
            '<a class="mini" href="' + item.files.prompt + '">Prompt MD</a>',
            '<button class="mini" type="button" data-copy="' + item.id + '">Copy Prompt</button>',
            '</div>',
            '</section>'
          ].join('');
        }).join('');

        rows.push([
          '<article class="row">',
          '<div class="rid">' + marker + '</div>',
          '<p class="rtitle">' + title + '</p>',
          '<div class="cells">' + cells + '</div>',
          '</article>'
        ].join(''));
      });

      el.rows.innerHTML = rows.join('');
      el.count.textContent = filtered.length + ' artifacts visible · ' + MATRIX.length + ' total artifacts';
    }

    el.rows.addEventListener("click", function (event) {
      const btn = event.target.closest("[data-copy]");
      if (!btn) return;
      const id = btn.getAttribute("data-copy");
      const item = MATRIX.find(function (row) { return row.id === id; });
      if (!item) return;
      copyText(item.video_prompt);
    });

    el.copyAll.addEventListener("click", function () {
      const all = MATRIX.map(function (item) {
        return '## ' + item.section.marker + ' ' + item.section.major + ' :: ' + item.agent.id + ' ' + item.agent.label + '\n\n' + item.video_prompt;
      }).join('\n\n');
      copyText(all);
    });

    el.search.addEventListener("input", function () {
      render(el.search.value || "");
    });

    render("");
  </script>
